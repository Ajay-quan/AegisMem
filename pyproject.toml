[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismem"
version = "0.1.0"
description = "Persistent Memory Architecture for Long-Running LLM Agents"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "AegisMem Contributors" }]

# Lean core: exactly what the FastAPI service imports to run end-to-end in the
# zero-infra default (in-memory relational + vector + graph stores, mock or
# local embeddings). Every external service is an opt-in extra below, so the
# declared dependency surface matches what the code actually requires.
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Production relational store
postgres = ["sqlalchemy>=2.0.0", "alembic>=1.13.0", "asyncpg>=0.29.0", "psycopg2-binary>=2.9.9"]
# External vector / graph backends
qdrant = ["qdrant-client>=1.9.0"]
neo4j = ["neo4j>=5.20.0"]
# Background workers / cache
queue = ["redis>=5.0.3", "celery>=5.3.6"]
# Real embedding models (default is a deterministic mock that needs none of these)
embeddings = ["sentence-transformers>=3.0.0", "transformers>=4.44.0", "scipy>=1.13.0"]
# LLM providers for reflection / consolidation
llm = ["openai>=1.30.0", "anthropic>=0.28.0", "tiktoken>=0.7.0", "tenacity>=8.3.0"]
# Structured logging + metrics + tracing
observability = [
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
]
# Agent framework integrations
agent = ["langgraph>=0.1.0", "langchain-core>=0.2.0"]
# Model Context Protocol server (integrations/mcp_server.py)
mcp = ["mcp[cli]>=1.0.0"]
# Self-contained Flask demo (apps/flask_app.py) with local FAISS/Chroma
flask-demo = ["flask>=3.0.0", "gunicorn>=22.0.0", "faiss-cpu>=1.8.0", "langchain-core>=0.2.0", "chromadb>=0.5.0"]
# CLI niceties
cli = ["typer>=0.12.3", "rich>=13.7.1", "python-ulid>=2.2.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.7",
    "black>=24.4.2",
    "factory-boy>=3.3.0",
    "faker>=25.3.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.26",
]
# Everything (production deployment)
all = [
    "aegismem[postgres,qdrant,neo4j,queue,embeddings,llm,observability,agent,mcp]",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["apps*", "core*", "domain*", "adapters*", "services*", "integrations*", "infra*"]
