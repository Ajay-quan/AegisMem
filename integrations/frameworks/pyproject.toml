[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismem-agents"
version = "0.1.0"
description = "AegisMem governed-memory tools for LangChain/LangGraph and the OpenAI Agents SDK"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aegismem-client>=0.1.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
openai-agents = ["openai-agents>=0.2"]

[tool.setuptools.packages.find]
include = ["aegismem_agents*"]
