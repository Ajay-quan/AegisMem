[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegismem-mcp"
version = "0.1.0"
description = "MCP server exposing AegisMem governed memory to any MCP client"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["aegismem-client>=0.1.0"]

[project.scripts]
aegismem-mcp = "aegismem_mcp.server:main"

[tool.setuptools.packages.find]
include = ["aegismem_mcp*"]
