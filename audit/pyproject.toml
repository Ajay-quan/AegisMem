[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-audit"
version = "0.1.0"
description = "Integrity audit for AI agent memory: revocation leaks, deletion residue, poisoning, isolation"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27"]

[project.scripts]
aegis-audit = "aegis_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["aegis_audit*"]
