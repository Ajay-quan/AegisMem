name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run focused Flask demo tests
        run: pytest tests/api/test_flask_api.py tests/unit/test_local_memory_components.py
      - name: Run local benchmark
        run: python scripts/evaluate_memory_retrieval.py --output-dir docs/benchmarks --asset-dir docs/assets
