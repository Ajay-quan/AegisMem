name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  flask-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flask demo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Run focused Flask demo tests
        run: pytest tests/api/test_flask_api.py tests/unit/test_local_memory_components.py
      - name: Run local benchmark
        run: python scripts/evaluate_memory_retrieval.py --output-dir docs/benchmarks --asset-dir docs/assets

  fastapi-zero-infra:
    runs-on: ubuntu-latest
    env:
      RELATIONAL_STORE: memory
      EMBEDDING_BACKEND: mock
      DEFAULT_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run domain + service + API tests (no external infra) with coverage
        run: >
          pytest tests/unit tests/integration tests/api
          --ignore=tests/unit/test_local_memory_components.py
          --ignore=tests/api/test_flask_api.py
          --cov=core --cov=domain --cov=services --cov=adapters
          --cov=apps/api --cov=sdk --cov=integrations
          --cov-report=term-missing
        # Add `--cov-fail-under=<N>` once a coverage baseline is agreed.
