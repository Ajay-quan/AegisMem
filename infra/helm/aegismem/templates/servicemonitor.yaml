{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "aegismem.fullname" . }}
  labels: {{- include "aegismem.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "aegismem.labels" . | nindent 6 }}
  endpoints: [{ port: http, path: /metrics, interval: {{ .Values.serviceMonitor.interval }} }]
{{- end }}
