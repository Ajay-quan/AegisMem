apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aegismem.fullname" . }}
  labels: {{- include "aegismem.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "aegismem.selector" . | nindent 6 }}
