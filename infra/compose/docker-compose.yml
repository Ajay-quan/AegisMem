# AegisMem single-store stack: Postgres (+pgvector) and Redis. Production-shaped:
# migrations run as the schema owner; the API runs as a non-superuser role so RLS applies.
#
#   cp infra/compose/.env.example infra/compose/.env   # set strong secrets
#   docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env up -d
#   docker compose -f infra/compose/docker-compose.yml exec api \
#       python scripts/aegisctl.py create-key --tenant acme --name bootstrap --scopes admin
#
# Add --profile observability for Prometheus + Grafana.

x-api-env: &api-env
  APP_ENV: staging
  APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER}
  AUTH_ENABLED: "true"
  POSTGRES_HOST: postgres
  POSTGRES_DB: aegismem
  POSTGRES_USER: aegis_app
  POSTGRES_PASSWORD: ${AEGIS_APP_PASSWORD:?set AEGIS_APP_PASSWORD}
  MEMORY_BACKEND: postgres
  VECTOR_BACKEND: pgvector
  GRAPH_BACKEND: none
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?set EMBEDDING_DIMENSION}
  REDIS_URL: redis://redis:6379/0
  RATE_LIMIT_BACKEND: redis
  EMBEDDING_BACKEND: openai
  EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://api.openai.com/v1}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aegismem
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      AEGIS_OWNER_PASSWORD: ${AEGIS_OWNER_PASSWORD:?set AEGIS_OWNER_PASSWORD}
      AEGIS_APP_PASSWORD: ${AEGIS_APP_PASSWORD:?set AEGIS_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegismem"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      AEGIS_MIGRATION_URL: postgresql://aegis_owner:${AEGIS_OWNER_PASSWORD}@postgres:5432/aegismem
      AEGIS_VECTOR_DIM: ${EMBEDDING_DIMENSION:?set EMBEDDING_DIMENSION}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach a host-local embedding server (e.g. Ollama)
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:
  grafana_data:
