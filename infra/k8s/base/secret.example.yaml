# NOT applied by kustomize. Create the real Secret with your secret manager (External Secrets,
# Sealed Secrets, Vault). POSTGRES_USER must be a NOSUPERUSER NOBYPASSRLS role or the API
# refuses to start (RLS would be bypassed). MIGRATION URL uses the schema-owner role.
apiVersion: v1
kind: Secret
metadata:
  name: aegismem-secrets
type: Opaque
stringData:
  APP_SECRET_KEY: "<48+ random chars>"
  API_KEY_PEPPER: "<48+ random chars, different from APP_SECRET_KEY>"
  POSTGRES_HOST: "postgres.internal"
  POSTGRES_DB: "aegismem"
  POSTGRES_USER: "aegis_app"
  POSTGRES_PASSWORD: "<app role password>"
  REDIS_URL: "rediss://:password@redis.internal:6380/0"
  AEGIS_MIGRATION_URL: "postgresql://aegis_owner:<owner password>@postgres.internal:5432/aegismem"
  OPENAI_API_KEY: ""
