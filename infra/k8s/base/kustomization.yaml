apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: aegismem
      app.kubernetes.io/part-of: aegismem
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - migrate-job.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: aegismem-api
    newName: ghcr.io/aegismem/api
    newTag: "0.1.0"
