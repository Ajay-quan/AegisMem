# API pods accept traffic only from the ingress controller (app traffic) and the monitoring
# namespace (/metrics scrapes). Adjust namespace labels to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegismem-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: api }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { port: 8000, protocol: TCP }
