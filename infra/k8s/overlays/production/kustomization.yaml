apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegismem
resources:
  - ../../base
images:
  - name: aegismem-api
    newName: ghcr.io/aegismem/api
    newTag: "0.1.0"   # pin by digest in CD: ghcr.io/aegismem/api@sha256:...
patches:
  - target: { kind: HorizontalPodAutoscaler, name: aegismem-api }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
  - target: { kind: ConfigMap, name: aegismem-config }
    patch: |
      - op: replace
        path: /data/OTEL_ENABLED
        value: "true"
